# Used by DB-backed tests (local and CI). The database name must end in _test:
# tests wipe it.
server:
  prefix: /api
  port: 8051
  host: localhost

api:
  defaultRatePerMin: 1000 #new keys; override per key with `key create --rate`
  keyCacheTTL: 60s #a revoked key stops working within this time
  ipRatePerMin: 60 #requests without a valid key, per client IP

service:
  root: .server

db:
  host: localhost
  port: 5432
  user: mfide_test
  password: mfide_test
  name: mfide_test
