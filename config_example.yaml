server:
  prefix: /api
  port: 8051
  host: localhost

api:
  defaultRatePerMin: 1000 #new keys; override per key with `key create --rate`
  keyCacheTTL: 60s #a revoked key stops working within this time
  ipRatePerMin: 60 #requests without a valid key, per client IP

fide:
  baseUrl: https://ratings.fide.com/download #only the published download files, never scraped pages
  fetchDelay: 3s #pause between consecutive downloads

sync:
  enabled: true #run the daily sync (fetch, import, retention) inside `mfide service`
  at: "03:00" #daily, server-local time; FIDE regenerates its files around 21:00 UTC

retention:
  currentFiles: 2 #newest imported current-list zips kept on disk (archive zips go once imported)
  removedPlayersDays: 90 #players gone from FIDE's list longer than this are deleted, with their history
  historyMonths: 60 #months of ratings kept, counting the current month; 0 = keep everything

log:
  format: console #console or json (for log shipping); to stderr
  level: info #debug, info, warn or error; debug also logs /health requests

service:
  root: .server #default; downloaded FIDE lists etc. go under here

db:
  host: localhost
  port: 5432
  user: user
  password: password
  name: name
